appId: com.fj.ai-worker
productName: FJ AI Worker
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  # The exported Next.js UI, served over app:// by main.ts.
  - from: ../web/out
    to: renderer

# The agent SDK spawns its `claude` binary from disk, and node-pty runs its
# helper — neither from inside asar.
asar: true
asarUnpack:
  - "**/node_modules/@anthropic-ai/claude-agent-sdk*/**"
  # The in-app terminal's native addon and its spawn-helper.
  - "**/node_modules/node-pty/**"

artifactName: "FJ-AI-Worker-${version}-${arch}.${ext}"

mac:
  category: public.app-category.developer-tools
  # The brand tile (build/icon.svg is its source; icon.icns and icon.png are rendered from it).
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  # Ad-hoc signed: a valid signature without a Developer ID (see AI Office).
  identity: "-"
  hardenedRuntime: false

toolsets:
  nsis: "1.2.1"
  winCodeSign: "1.1.0"

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: "FJ-AI-Worker-Setup-${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
